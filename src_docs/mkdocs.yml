# this_file: src_docs/mkdocs.yml
site_name: vexy-mkdocs-strip-number-prefix
site_description: MkDocs plugin to strip numeric prefixes from page URLs while keeping them in source files
site_url: https://vexy.dev/vexy-mkdocs-strip-number-prefix/
repo_url: https://github.com/vexyart/vexy-mkdocs-strip-number-prefix
repo_name: vexyart/vexy-mkdocs-strip-number-prefix
edit_uri: edit/main/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - search
  # Dog-food: the source files below carry numeric prefixes (010--, 020--, ...)
  # and this plugin removes them from the published URLs.
  - strip-number-prefix:
      pattern: '^\d+--'
      strict: true
nav:
  - Home: index.md
  - Getting started:
      - Installation: 010--installation.md
      - Quickstart: 020--quickstart.md
  - Guide:
      - Configuration: 030--configuration.md
      - How it works: 040--how-it-works.md
      - Links and navigation: 050--links-and-navigation.md
      - Edge cases and troubleshooting: 060--edge-cases.md
      - Migrating from awesome-pages: 070--migration.md
  - Examples:
      - File layouts: 080--examples/010--file-layouts.md
      - Prefix patterns: 080--examples/020--prefix-patterns.md
  - Development: 090--development.md
